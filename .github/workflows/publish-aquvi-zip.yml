name: Publish Aquvi ZIP
on:
  push:
    paths:
      - ".github/workflows/publish-aquvi-zip.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate release ZIP
        env:
          ARTIFACT_URL_B64: ""
        run: |
          set -euo pipefail
          ARTIFACT_URL="$(printf '%s' "$ARTIFACT_URL_B64" | base64 --decode)"
          mkdir -p aquvi/downloads
          curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/aquvi-artifact.zip
          unzip -p /tmp/aquvi-artifact.zip Aquvi-0.3.6-free.zip > aquvi/downloads/Aquvi-0.3.6-free.zip
          unzip -t aquvi/downloads/Aquvi-0.3.6-free.zip
          unzip -Z1 aquvi/downloads/Aquvi-0.3.6-free.zip | grep -qx 'manifest.json'
      - name: Commit ZIP and remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/publish-aquvi-zip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aquvi/downloads/Aquvi-0.3.6-free.zip .github/workflows/publish-aquvi-zip.yml
          git commit -m "Publish Aquvi 0.3.6 Free ZIP"
          git push
