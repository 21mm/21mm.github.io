<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="21mm のウェブサイト">
  <title>21mm</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }
    main { width: min(100%, 42rem); }
    h1 { margin: 0 0 .5rem; font-size: clamp(2.5rem, 8vw, 4rem); }
    p { color: color-mix(in srgb, currentColor 72%, transparent); }
    .greeting { font-size: 1.2rem; color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>21mm</h1>
    <p class="greeting">こんにちは。21mmのウェブサイトへようこそ。</p>
    <p>ここから少しずつ、好きなことや作ったもの、日々の記録などを紹介していきます。</p>
  </main>
</body>
</html>
