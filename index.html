<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="21mm — Personal Works">
  <meta name="theme-color" content="#101827">
  <title>21mm — Personal Works</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1120;--panel:#121d30;--panel2:#18263d;--line:#2a3a55;--text:#edf3ff;--muted:#a2b0c7;--accent:#9fc2ff;--mint:#9fe1c1}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 420px at 12% -10%,#1d3558 0,transparent 65%),var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{width:min(900px,calc(100% - 40px));margin:auto}header{padding:26px 0;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:850;letter-spacing:.04em}.brand span{color:var(--accent)}
    main{padding:76px 0 88px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(42px,8vw,76px);line-height:1.08;letter-spacing:-.055em;margin:14px 0 18px}.intro{max-width:650px;color:var(--muted);font-size:17px}
    .section{margin-top:64px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}h2{font-size:21px;margin:0;letter-spacing:-.02em}.section-head p{margin:0;color:var(--muted);font-size:13px}
    .card{display:flex;flex-direction:column;min-height:210px;max-width:620px;padding:23px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 70%),var(--panel);color:inherit;text-decoration:none;transition:transform .16s,border-color .16s,background .16s}.card:hover{transform:translateY(-3px);border-color:#5877a8;background-color:var(--panel2)}.card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em}.pill{border:1px solid #425675;border-radius:999px;padding:3px 9px;color:var(--muted);font-size:10px;letter-spacing:0}h3{font-size:19px;line-height:1.4;margin:20px 0 7px}.card p{color:var(--muted);font-size:13px;margin:0 0 18px}.open{margin-top:auto;color:var(--mint);font-size:13px;font-weight:750}
    footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:12px}@media(max-width:650px){.wrap{width:min(100% - 28px,900px)}main{padding:52px 0 64px}.card{min-height:185px}.section{margin-top:48px}}
  </style>
</head>
<body>
  <header><div class="wrap"><div class="brand">21<span>mm</span></div></div></header>
  <main class="wrap">
    <div class="eyebrow">Personal Works · 21mm</div>
    <h1>21mm</h1>
    <p class="intro">個人制作のソフトウェアやWeb作品を公開しています。</p>
    <section class="section" aria-labelledby="software-heading">
      <div class="section-head"><h2 id="software-heading">Software</h2><p>デスクトップで使うツール</p></div>
      <a class="card" href="./aquvi/">
        <div class="meta"><span>CHROME EXTENSION</span><span class="pill">Free Preview</span></div>
        <h3>Aquvi — Private Archive Viewer</h3>
        <p>ローカルの画像アーカイブを閲覧するChrome拡張。暗号化ZIP・7zにも対応。</p>
        <span class="open">製品ページを見る →</span>
      </a>
    </section>
  </main>
  <footer><div class="wrap">21mm · Personal website</div></footer>
</body>
</html>
