<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<title>特別捜査本部 — 基本画面プロトタイプ</title>
<style>
:root{color-scheme:dark;--ink:#e8eeee;--muted:#a9b9bb;--line:#6b898d;--gold:#d7c18d;--panel:rgba(7,18,25,.94)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131b;color:var(--ink);font-family:"Yu Gothic",YuGothic,Meiryo,sans-serif}
button{font:inherit;color:inherit}
#stage{position:relative;width:100%;height:100%;isolation:isolate;background:#10232b}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene svg{width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,8,13,.5),transparent 19%,transparent 72%,rgba(0,7,12,.48))}
.brand{position:absolute;top:18px;left:22px;z-index:5;color:#e6eeee;text-shadow:0 2px 8px #000;font-size:11px;letter-spacing:.18em;pointer-events:none}
.brand small{display:block;margin-top:5px;color:#a9c0c2;font-size:9px;letter-spacing:.12em}
.menu-trigger{position:absolute;right:22px;top:18px;z-index:20;width:44px;height:44px;border:1px solid #9db4b3;background:rgba(4,15,21,.72);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer}
.menu-trigger span,.menu-trigger span:before,.menu-trigger span:after{display:block;width:17px;height:1px;background:#e8eeee;position:relative;content:""}
.menu-trigger span:before{position:absolute;top:-6px}.menu-trigger span:after{position:absolute;top:6px}
.hotspot{position:absolute;z-index:4;border:1px solid transparent;background:transparent;cursor:pointer;border-radius:3px;transform:translate(-50%,-50%);transition:background .15s,border-color .15s}
.hotspot:hover,.hotspot:focus-visible{outline:none;border-color:rgba(218,202,151,.9);background:rgba(218,202,151,.12);box-shadow:0 0 22px rgba(218,202,151,.18)}
#spot-cabinet{left:18.5%;top:49%;width:17%;height:46%}
#spot-phone{left:40%;top:73%;width:10%;height:13%}
#spot-files{left:54%;top:72%;width:19%;height:21%}
#spot-monitor{left:68%;top:42%;width:19%;height:37%}
#spot-door{left:91%;top:48%;width:13%;height:61%}
#spot-person{left:30%;top:57%;width:15%;height:49%}
.context{position:absolute;z-index:30;min-width:190px;max-width:min(260px,calc(100vw - 28px));padding:0;background:var(--panel);border:1px solid #829da0;box-shadow:0 12px 36px #0009;backdrop-filter:blur(12px);display:none}
.context.open{display:block;animation:appear .12s ease-out}
.context-title{padding:10px 13px;border-bottom:1px solid #3c5960;color:var(--gold);font-size:11px;letter-spacing:.1em}
.context-actions{padding:5px}
.context-actions button{display:block;width:100%;padding:10px 9px;border:0;background:transparent;text-align:left;font-size:12px;cursor:pointer}
.context-actions button:hover,.context-actions button:focus-visible{outline:none;background:#29434b}
.context-actions button:before{content:"›";color:var(--gold);margin-right:9px}
.dialogue{position:absolute;z-index:25;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(900px,calc(100% - 36px));padding:15px 19px 13px;border:1px solid #9aafb0;background:rgba(5,16,22,.94);box-shadow:0 10px 34px #0009;display:none}
.dialogue.open{display:block;animation:appear .16s ease-out}
.speaker{color:var(--gold);font-size:11px;letter-spacing:.1em;margin-bottom:7px}
.line{font-size:14px;line-height:1.85;min-height:2em}
.dialogue-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#8fa7aa;font-size:10px}
.dialogue-footer button{border:1px solid #627d82;background:#182d34;padding:6px 13px;cursor:pointer}
.overlay{position:absolute;inset:0;z-index:40;background:rgba(1,8,12,.66);display:none;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(5px)}
.overlay.open{display:flex}
.sheet{width:min(540px,100%);max-height:min(78vh,650px);overflow:auto;border:1px solid #829da0;background:rgba(7,19,26,.97);box-shadow:0 20px 60px #000b}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid #3c5960}
.sheet-head h2{font-size:13px;font-weight:500;letter-spacing:.15em;margin:0;color:var(--gold)}
.close{width:32px;height:32px;border:1px solid #607b80;background:transparent;cursor:pointer;font-size:18px}
.sheet-body{padding:12px 18px 18px}
.menu-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-list button{padding:14px 12px;text-align:left;border:1px solid #3d5b62;background:#142a32;cursor:pointer}
.menu-list button:hover{background:#203e47;border-color:#9bb3b2}
.menu-list strong{display:block;font-size:12px;font-weight:500}
.menu-list small{display:block;color:#9eb2b4;font-size:10px;margin-top:5px}
.record{padding:12px 0;border-bottom:1px solid #29434a;font-size:12px;line-height:1.7}
.record:last-child{border:0}
.record small{display:block;color:#9eb2b4;margin-top:3px;font-size:10px}
.toast{position:absolute;z-index:50;left:50%;top:78px;transform:translateX(-50%);padding:8px 14px;background:rgba(4,15,20,.9);border:1px solid #637f83;color:#dce7e6;font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){
 .brand{left:13px;top:13px;font-size:9px}.brand small{font-size:8px}
 .menu-trigger{right:13px;top:13px;width:40px;height:40px}
 #spot-cabinet{left:17%;width:23%}#spot-phone{left:40%;top:75%;width:15%}#spot-files{left:55%;top:74%;width:24%}#spot-monitor{left:70%;top:42%;width:25%}#spot-door{left:94%;width:15%}#spot-person{left:29%;width:20%}
 .dialogue{width:calc(100% - 22px);bottom:max(11px,env(safe-area-inset-bottom));padding:12px 13px}
 .line{font-size:12px}.menu-list{grid-template-columns:1fr}
}
</style>
</head>
<body>

      <defs>

      <g stroke="#d1c3a0" stroke-width="2" opacity=".45"><path d="M1082 190h28m-28 8h28m-28 8h28M1127 180h20m-20 8h20m-20 8h20M1170 200h27m-27 8h27M1220 180h18m-18 8h18"/></g>

  </div>
  <div class="shade"></div>
  <div class="brand">BAYLINE CASE FILE<small>特別捜査本部 / 23:18 TOKYO</small></div>
  <button class="menu-trigger" id="mainMenuButton" aria-label="メニューを開く"><span></span></button>
  <button class="hotspot" id="spot-cabinet" data-target="cabinet" aria-label="書類棚"></button>
  <button class="hotspot" id="spot-phone" data-target="phone" aria-label="電話"></button>
  <button class="hotspot" id="spot-files" data-target="files" aria-label="机の書類"></button>
  <button class="hotspot" id="spot-monitor" data-target="monitor" aria-label="モニター"></button>
  <button class="hotspot" id="spot-door" data-target="door" aria-label="扉"></button>
  <button class="hotspot" id="spot-person" data-target="person" aria-label="捜査員"></button>
  <div class="context" id="contextMenu" role="menu"><div class="context-title" id="contextTitle"></div><div class="context-actions" id="contextActions"></div></div>
  <section class="dialogue" id="dialogue" aria-live="polite"><div class="speaker" id="speaker"></div><div class="line" id="dialogueText"></div><div class="dialogue-footer"><span>会話中</span><button id="dialogueClose">閉じる</button></div></section>
  <section class="overlay" id="mainOverlay" aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet"><header class="sheet-head"><h2 id="sheetTitle">捜査メニュー</h2><button class="close" data-close aria-label="閉じる">×</button></header><div class="sheet-body" id="sheetBody"></div></div>
  </section>
  <div class="toast" id="toast" role="status"></div>
</main>
<script>
const targets={
 cabinet:{title:"書類棚",actions:[["棚を調べる","棚には事件資料と過去の報告書が並んでいる。必要な資料を探せそうだ。"],["事件ファイルを見る","関連資料の背表紙に、湾岸線沿線で発生した複数の事案が記されている。"],["戻る",null]]},
 phone:{title:"卓上電話",actions:[["受話器を取る","回線はつながっている。今は新しい連絡は入っていない。"],["着信履歴を確認","最後の着信は23時06分。発信元は庁内の内線番号だった。"],["戻る",null]]},
 files:{title:"机の書類",actions:[["書類を調べる","現場から届いた一次報告書と、時刻を記したメモが重ねられている。"],["報告書を読む","複数の駅で似た症状が報告されている。発生時刻には一定の偏りがある。"],["戻る",null]]},
 monitor:{title:"端末モニター",actions:[["端末を操作","庁内ネットワークに接続されている。事件記録と交通情報を参照できる。"],["交通情報を表示","湾岸線周辺の運行情報に、短時間の遅延記録が残っている。"],["戻る",null]]},
 door:{title:"本部の扉",actions:[["外へ出る","今は捜査本部を離れる段階ではない。"],["廊下の様子をうかがう","廊下には人影がない。遠くで電話の呼び出し音が聞こえる。"],["戻る",null]]},
 person:{title:"捜査員",actions:[["話しかける","三枝「現場からの追加報告は、まだ届いていません。まずは時系列を整理しましょう」"],["状況を聞く","三枝「被害の発生場所と時間を並べれば、共通点が見えてくるはずです」"],["戻る",null]]}
};
const menu=document.getElementById("contextMenu"), title=document.getElementById("contextTitle"), actions=document.getElementById("contextActions"), overlay=document.getElementById("mainOverlay"), sheetTitle=document.getElementById("sheetTitle"), sheetBody=document.getElementById("sheetBody"), dialogue=document.getElementById("dialogue"), toast=document.getElementById("toast");
let toastTimer;
function closeContext(){menu.classList.remove("open")}
function closeOverlay(){overlay.classList.remove("open")}
function showToast(message){toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),1800)}
function speak(name,message){closeContext();document.getElementById("speaker").textContent=name;document.getElementById("dialogueText").textContent=message;dialogue.classList.add("open")}
function openTarget(id,button){
 const item=targets[id];if(!item)return;
 closeContext();title.textContent=item.title;actions.replaceChildren();
 item.actions.forEach(([label,message])=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.addEventListener("click",()=>{closeContext();if(label==="戻る")return;speak(id==="person"?"三枝 遼":item.title,message)});actions.append(b)});
 const stage=document.getElementById("stage").getBoundingClientRect(),r=button.getBoundingClientRect();
 menu.style.left=Math.min(Math.max(12,r.left+r.width/2-90),stage.width-205)+"px";
 menu.style.top=Math.min(Math.max(70,r.top+r.height/2-25),stage.height-190)+"px";
 menu.classList.add("open");
}
document.querySelectorAll(".hotspot").forEach(b=>b.addEventListener("click",()=>openTarget(b.dataset.target,b)));
document.getElementById("mainMenuButton").addEventListener("click",()=>{
 closeContext();sheetTitle.textContent="捜査メニュー";
 sheetBody.innerHTML='<div class="menu-list"><button data-page="inventory"><strong>所持品</strong><small>入手した証拠・資料</small></button><button data-page="people"><strong>関係者</strong><small>人物情報と証言</small></button><button data-page="records"><strong>捜査記録</strong><small>確認した情報の一覧</small></button><button data-page="save"><strong>セーブ</strong><small>現在の進行状況を保存</small></button></div>';
 sheetBody.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>openPage(b.dataset.page)));
 overlay.classList.add("open");
});
function openPage(page){
 const pages={
 inventory:["所持品",'<div class="record">所持品はまだありません。<small>調査で見つけた資料や証拠がここに追加されます。</small></div>'],
